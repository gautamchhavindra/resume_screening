# Base URL of the Python FastAPI resume-screening service (see ../resume-screening-agent/api.py)
api.baseUrl=https://resume-screening-txny.onrender.com
server.port=${PORT:8084}
# API key sent as the X-API-Key header on every call to the screening API.
# Set the RECRUITMENT_API_KEY environment variable before starting the app;
# leave it unset to send no key (matches the Python API's default no-auth mode).
api.key=${RECRUITMENT_API_KEY:change-me}

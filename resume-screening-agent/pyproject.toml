[project]
name = "resume-screening-agent"
version = "0.1.0"
description = "AI resume screening pipeline: cosine-similarity shortlist + provider-agnostic LLM nuanced scoring, exposed via FastAPI"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
